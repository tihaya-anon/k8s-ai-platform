<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Platform API</title>
    <!-- Swagger UI is vendored, not loaded from a CDN: the lab has to work on a disconnected
         machine, and a docs page that only renders online is not a docs page. -->
    <link rel="stylesheet" href="/docs/swagger-ui.css" />
    <style>
      body {
        margin: 0;
        background: #fafafa;
      }
      .topbar-note {
        padding: 12px 20px;
        background: #1b1f23;
        color: #d1d5da;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .topbar-note b {
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="topbar-note">
      <b>AI Platform control plane</b> &mdash; every request you fire here is the same call the
      <code>platform ctl</code> CLI makes. The release path is gated: a model version has to pass
      its evaluation before <code>/v1/routes/{model}/canary</code> will accept it.
    </div>
    <div id="swagger-ui"></div>
    <script src="/docs/swagger-ui-bundle.js"></script>
    <script>
      window.ui = SwaggerUIBundle({
        url: "/openapi.yaml",
        dom_id: "#swagger-ui",
        presets: [SwaggerUIBundle.presets.apis],
        layout: "BaseLayout",
        deepLinking: true,
        tryItOutEnabled: true,
        displayRequestDuration: true,
        defaultModelsExpandDepth: 1,
        docExpansion: "list",
      });
    </script>
  </body>
</html>
