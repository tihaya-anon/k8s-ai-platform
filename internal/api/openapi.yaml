components:
  schemas:
    CanaryInputBody:
      additionalProperties: false
      properties:
        percent:
          default: 10
          description: Percent of traffic the canary lane receives.
          format: int64
          maximum: 100
          minimum: 1
          type: integer
        replicas:
          description: Replicas per served version; 0 keeps the current value.
          format: int64
          minimum: 0
          type: integer
        version:
          description: Model version to put behind the canary lane.
          minLength: 1
          type: string
      required:
        - version
      type: object
    Dataset:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          type: string
        golden:
          type: boolean
        name:
          type: string
        owner:
          type: string
        rows:
          format: int64
          type: integer
        uri:
          type: string
        version:
          type: string
      required:
        - name
        - version
        - owner
        - uri
        - rows
        - golden
        - createdAt
      type: object
    DatasetInputBody:
      additionalProperties: false
      properties:
        generate:
          description: Materialise deterministic synthetic rows at the URI.
          type: boolean
        golden:
          description: Golden datasets are the only ones evaluation will score against.
          type: boolean
        name:
          description: Logical dataset name.
          minLength: 1
          type: string
        owner:
          description: Owning team or person. Every platform object has an owner.
          minLength: 1
          type: string
        rows:
          default: 200
          description: Number of rows the dataset holds.
          format: int64
          minimum: 1
          type: integer
        uri:
          description: Where the rows live. Defaults to a path on the shared artifact volume.
          type: string
        version:
          description: Dataset version; a name and version together are immutable.
          minLength: 1
          type: string
      required:
        - name
        - version
        - owner
      type: object
    Deployment:
      additionalProperties: false
      properties:
        modelRef:
          type: string
        name:
          type: string
        ready:
          format: int64
          type: integer
        replicas:
          format: int64
          type: integer
        service:
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - modelRef
        - name
        - replicas
        - ready
        - service
        - updatedAt
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    EvaluationInputBody:
      additionalProperties: false
      properties:
        datasetRef:
          description: Golden dataset to score against, as name:version.
          minLength: 1
          type: string
        gates:
          $ref: "#/components/schemas/GatesBody"
          description: Promotion thresholds. Omit to use the platform defaults.
        modelRef:
          description: Model version to score, as name:version.
          minLength: 1
          type: string
        name:
          description: Evaluation name, unique across evaluations.
          minLength: 1
          type: string
        owner:
          description: Owning team or person.
          type: string
      required:
        - name
        - modelRef
        - datasetRef
      type: object
    EvaluationJob:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          type: string
        datasetRef:
          type: string
        finishedAt:
          format: date-time
          type: string
        gates:
          $ref: "#/components/schemas/Gates"
        k8sJob:
          type: string
        metrics:
          $ref: "#/components/schemas/Metrics"
        modelRef:
          type: string
        name:
          type: string
        owner:
          type: string
        passed:
          type: boolean
        phase:
          type: string
        reason:
          type: string
      required:
        - name
        - owner
        - modelRef
        - datasetRef
        - gates
        - phase
        - createdAt
      type: object
    Event:
      additionalProperties: false
      properties:
        kind:
          type: string
        message:
          type: string
        name:
          type: string
        time:
          format: date-time
          type: string
        type:
          type: string
      required:
        - time
        - kind
        - name
        - type
        - message
      type: object
    Gates:
      additionalProperties: false
      properties:
        maxCostPerKReq:
          format: double
          type: number
        maxP95LatencyMs:
          format: double
          type: number
        minAccuracy:
          format: double
          type: number
      required:
        - minAccuracy
        - maxP95LatencyMs
        - maxCostPerKReq
      type: object
    GatesBody:
      additionalProperties: false
      properties:
        maxCostPerKReq:
          description: Maximum cost per 1000 requests; 0 disables the cost gate.
          format: double
          minimum: 0
          type: number
        maxP95LatencyMs:
          description: Maximum p95 latency in milliseconds; 0 disables the latency gate.
          format: double
          minimum: 0
          type: number
        minAccuracy:
          description: Minimum accuracy the model must reach.
          format: double
          maximum: 1
          minimum: 0
          type: number
      type: object
    Metrics:
      additionalProperties: false
      properties:
        accuracy:
          format: double
          type: number
        costPerKReq:
          format: double
          type: number
        p95LatencyMs:
          format: double
          type: number
        samples:
          format: int64
          type: integer
      required:
        - accuracy
        - p95LatencyMs
        - costPerKReq
        - samples
      type: object
    ModelVersion:
      additionalProperties: false
      properties:
        artifactUri:
          type: string
        createdAt:
          format: date-time
          type: string
        datasetRef:
          type: string
        metrics:
          $ref: "#/components/schemas/Metrics"
        name:
          type: string
        owner:
          type: string
        reason:
          type: string
        sourceJob:
          type: string
        status:
          type: string
        version:
          type: string
      required:
        - name
        - version
        - owner
        - artifactUri
        - status
        - metrics
        - createdAt
      type: object
    RollbackInputBody:
      additionalProperties: false
      properties:
        reason:
          description: Why the canary is being dropped. Recorded on the event timeline.
          type: string
      type: object
    Route:
      additionalProperties: false
      properties:
        canaryPercent:
          format: int64
          type: integer
        canaryVersion:
          type: string
        model:
          type: string
        replicas:
          format: int64
          type: integer
        stableVersion:
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - model
        - canaryPercent
        - replicas
        - updatedAt
      type: object
    RouteView:
      additionalProperties: false
      properties:
        canaryPercent:
          format: int64
          type: integer
        canaryReady:
          format: int64
          type: integer
        canaryVersion:
          type: string
        model:
          type: string
        replicas:
          format: int64
          type: integer
        stableReady:
          format: int64
          type: integer
        stableVersion:
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - stableReady
        - canaryReady
        - model
        - canaryPercent
        - replicas
        - updatedAt
      type: object
    ScaleInputBody:
      additionalProperties: false
      properties:
        replicas:
          description: Replicas per served version. Online inference keeps a floor of one.
          format: int64
          minimum: 1
          type: integer
      required:
        - replicas
      type: object
    StatusReport:
      additionalProperties: false
      properties:
        datasets:
          items:
            $ref: "#/components/schemas/Dataset"
          type:
            - array
            - "null"
        deployments:
          items:
            $ref: "#/components/schemas/Deployment"
          type:
            - array
            - "null"
        evaluations:
          items:
            $ref: "#/components/schemas/EvaluationJob"
          type:
            - array
            - "null"
        events:
          items:
            $ref: "#/components/schemas/Event"
          type:
            - array
            - "null"
        models:
          items:
            $ref: "#/components/schemas/ModelVersion"
          type:
            - array
            - "null"
        routes:
          items:
            $ref: "#/components/schemas/Route"
          type:
            - array
            - "null"
        trainingJobs:
          items:
            $ref: "#/components/schemas/TrainingJob"
          type:
            - array
            - "null"
      required:
        - datasets
        - trainingJobs
        - models
        - evaluations
        - routes
        - deployments
        - events
      type: object
    TrainingInputBody:
      additionalProperties: false
      properties:
        baseModel:
          description: Base model the run fine-tunes.
          type: string
        checkpointEvery:
          default: 5
          description: Checkpoint interval in steps. A restarted job resumes from the last checkpoint.
          format: int64
          minimum: 1
          type: integer
        datasetRef:
          description: Training dataset, as name:version. It must already be registered.
          minLength: 1
          type: string
        gpus:
          default: 1
          description: GPUs requested for the pod.
          format: int64
          minimum: 1
          type: integer
        modelName:
          description: Logical model name the produced artifact registers under.
          minLength: 1
          type: string
        name:
          description: Job name, unique across training jobs.
          minLength: 1
          type: string
        owner:
          description: Owning team or person.
          minLength: 1
          type: string
        priority:
          description: Scheduling priority; higher runs first when the queue is contended.
          format: int64
          type: integer
        steps:
          default: 20
          description: Training steps to run.
          format: int64
          minimum: 1
          type: integer
      required:
        - name
        - owner
        - datasetRef
        - modelName
      type: object
    TrainingJob:
      additionalProperties: false
      properties:
        artifactUri:
          type: string
        attempt:
          format: int64
          type: integer
        baseModel:
          type: string
        checkpointEvery:
          format: int64
          type: integer
        createdAt:
          format: date-time
          type: string
        datasetRef:
          type: string
        finishedAt:
          format: date-time
          type: string
        gpus:
          format: int64
          type: integer
        k8sJob:
          type: string
        modelName:
          type: string
        modelRef:
          type: string
        name:
          type: string
        owner:
          type: string
        phase:
          type: string
        priority:
          format: int64
          type: integer
        reason:
          type: string
        startedAt:
          format: date-time
          type: string
        steps:
          format: int64
          type: integer
      required:
        - name
        - owner
        - baseModel
        - datasetRef
        - modelName
        - steps
        - gpus
        - priority
        - checkpointEvery
        - phase
        - attempt
        - createdAt
      type: object
info:
  description: |-
    The control plane for an internal AI model operations platform. Every platform object is
    created, inspected, and released through this API; nothing in the product loop requires
    kubectl.

    The loop is: register a dataset version, submit a training job, let it produce a model
    artifact, evaluate that artifact against a golden dataset, and only then route traffic to it.

    **The release path is gated.** A model version moves
    `Registered -> Evaluating -> PromotionReady -> Canary -> Stable`, and
    `POST /v1/routes/{model}/canary` refuses any version that is not `PromotionReady`.
    That refusal is the difference between a platform and a deployment script, so it is worth
    trying on purpose.
  title: AI Platform control plane
  version: 1.0.0
openapi: 3.1.0
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: The control plane is serving.
          headers:
            Content-Type:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Liveness probe
      tags:
        - observability
  /metrics:
    get:
      description: API counters plus gauges for training job phases and model version statuses.
      operationId: metrics
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: Metrics in the Prometheus text exposition format.
          headers:
            Content-Type:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Prometheus metrics
      tags:
        - observability
  /v1/datasets:
    get:
      operationId: list-datasets
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Dataset"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List every registered dataset version
      tags:
        - datasets
    post:
      description: "Datasets are immutable: re-registering the same name and version is a conflict."
      operationId: create-dataset
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatasetInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"
          description: Created
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Register a dataset version
      tags:
        - datasets
  /v1/deployments:
    get:
      operationId: list-deployments
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Deployment"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List the model servers the controller keeps running
      tags:
        - observability
  /v1/evaluations:
    get:
      operationId: list-evaluations
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/EvaluationJob"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List every evaluation
      tags:
        - evaluation
    post:
      description: Passing the gates is what moves a model version to PromotionReady, which is the only status a canary will accept.
      operationId: create-evaluation
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluationInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationJob"
          description: Created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Score a model version against a golden dataset
      tags:
        - evaluation
  /v1/evaluations/{name}:
    get:
      operationId: get-evaluation
      parameters:
        - description: Object name.
          in: path
          name: name
          required: true
          schema:
            description: Object name.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationJob"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Read one evaluation
      tags:
        - evaluation
  /v1/events:
    get:
      description: Every state transition emits an event. This log is the incident timeline.
      operationId: list-events
      parameters:
        - description: Only events for this object name.
          explode: false
          in: query
          name: name
          schema:
            description: Only events for this object name.
            type: string
        - description: Most recent events to return.
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: Most recent events to return.
            format: int64
            maximum: 1000
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Event"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Read the event log
      tags:
        - observability
  /v1/models:
    get:
      operationId: list-models
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ModelVersion"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List every registered model version
      tags:
        - models
  /v1/models/{ref}:
    get:
      operationId: get-model
      parameters:
        - description: Model reference, as name:version.
          in: path
          name: ref
          required: true
          schema:
            description: Model reference, as name:version.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelVersion"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Read one model version
      tags:
        - models
  /v1/routes:
    get:
      description: This is what the gateway polls. A lane that has been declared but has no ready replicas must not receive traffic, so the readiness counts travel with the weights.
      operationId: list-routes
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/RouteView"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List every route with per-lane readiness
      tags:
        - release
  /v1/routes/{model}:
    get:
      operationId: get-route
      parameters:
        - description: Logical model name the route serves.
          in: path
          name: model
          required: true
          schema:
            description: Logical model name the route serves.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Read one route
      tags:
        - release
  /v1/routes/{model}/canary:
    post:
      description: "The gate lives here: a version that is not PromotionReady is refused with 409. This is the difference between a platform and a deployment script."
      operationId: start-canary
      parameters:
        - description: Logical model name the route serves.
          in: path
          name: model
          required: true
          schema:
            description: Logical model name the route serves.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CanaryInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Send a share of traffic to a new version
      tags:
        - release
  /v1/routes/{model}/promote:
    post:
      description: The version it replaces is retired, with the replacement named as the reason.
      operationId: promote-route
      parameters:
        - description: Logical model name the route serves.
          in: path
          name: model
          required: true
          schema:
            description: Logical model name the route serves.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Make the canary version stable
      tags:
        - release
  /v1/routes/{model}/rollback:
    post:
      description: Application code never changes; only the route does. The dropped version moves to PromotionBlocked with the reason recorded.
      operationId: rollback-route
      parameters:
        - description: Logical model name the route serves.
          in: path
          name: model
          required: true
          schema:
            description: Logical model name the route serves.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollbackInputBody"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
