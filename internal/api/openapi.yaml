  /v1/routes/{model}/scale:
    post:
      operationId: scale-route
      parameters:
        - description: Logical model name the route serves.
          in: path
          name: model
          required: true
          schema:
            description: Logical model name the route serves.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScaleInputBody"
