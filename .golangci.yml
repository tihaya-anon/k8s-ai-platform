version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    misspell:
      ignore-rules:
        # Project, Kubernetes, and ML platform terms that are intentional in
        # docs, comments, generated manifests, and test names.
        - aiplatform
        - apiserver
        - certmanager
        - clusterrolebinding
        - controllergen
        - copyloopvar
        - crd
        - crds
        - dset
        - dupl
        - envtest
        - errcheck
        - ginkgo
        - goconst
        - gocyclo
        - gomega
        - gofmt
        - goimports
        - golangci
        - govet
        - ginkgolinter
        - ineffassign
        - istio
        - jsonpath
        - knative
        - kubebuilder
        - kubelet
        - kueue
        - kserve
        - kustomize
        - lll
        - markdownlint
        - misspell
        - mmdc
        - nakedret
        - modelversion
        - openapi
        - ownerreference
        - prealloc
        - prometheus
        - pvc
        - rbac
        - reconciler
        - reconcilers
        - revive
        - servicemonitor
        - staticcheck
        - unconvert
        - unparam
        - unused
        - webhook
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
