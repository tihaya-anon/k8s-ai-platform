# This file configures golangci-lint with module plugins.
# When you run 'make lint', it will automatically build a custom golangci-lint binary
# with all the plugins listed below.
#
# See: https://golangci-lint.run/plugins/module-plugins/
#
# version must equal GOLANGCI_LINT_VERSION in the Makefile: `golangci-lint custom` rebuilds that
# release with the plugins compiled in, so a mismatch means `make lint` and CI lint with a different
# golangci-lint than the one the Makefile says. The plugin is pinned rather than `latest` (the
# scaffold's default) so that two builds of the same commit lint the same way.
version: v2.15.0
plugins:
  # logcheck validates structured logging calls and parameters (e.g., balanced key-value pairs)
  - module: "sigs.k8s.io/logtools"
    import: "sigs.k8s.io/logtools/logcheck/gclplugin"
    version: v0.11.0
