# The control plane creates and watches the workloads it owns, and nothing else. Training,
# evaluation, and model-server pods reuse the same identity but never call the API server.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-platform
  namespace: ai-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-platform
  namespace: ai-platform
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-platform
  namespace: ai-platform
subjects:
  - kind: ServiceAccount
    name: ai-platform
    namespace: ai-platform
roleRef:
  kind: Role
  name: ai-platform
  apiGroup: rbac.authorization.k8s.io
