apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: control-plane
    app.kubernetes.io/part-of: ai-platform
spec:
  replicas: 1
  strategy:
    # The control plane owns a single state file on a host volume, so two copies must never run.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-plane
    spec:
      serviceAccountName: ai-platform
      containers:
        - name: control-plane
          image: ai-platform:dev
          imagePullPolicy: IfNotPresent
          args: ["control-plane"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PLATFORM_IMAGE
              value: ai-platform:dev
            - name: ARTIFACT_DIR
              value: /artifacts
            - name: ARTIFACT_HOST_PATH
              value: /artifacts
            - name: WORKLOAD_SERVICE_ACCOUNT
              value: ai-platform
          volumeMounts:
            - name: artifacts
              mountPath: /artifacts
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: artifacts
          hostPath:
            path: /artifacts
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: ai-platform
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: control-plane
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
      name: http
