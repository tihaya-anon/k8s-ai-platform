apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: ai-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
    spec:
      serviceAccountName: ai-platform
      containers:
        - name: gateway
          image: ai-platform:dev
          imagePullPolicy: IfNotPresent
          args: ["gateway"]
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONTROL_PLANE_URL
              value: http://control-plane.ai-platform.svc:8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 1
            periodSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: ai-platform
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30081
      name: http
