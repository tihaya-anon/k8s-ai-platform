---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-ml-aiplatform-io-v1alpha1-dataset
  failurePolicy: Fail
  name: mdataset-v1alpha1.kb.io
  rules:
  - apiGroups:
    - ml.aiplatform.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - datasets
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-ml-aiplatform-io-v1alpha1-dataset
  failurePolicy: Fail
  name: vdataset-v1alpha1.kb.io
  rules:
  - apiGroups:
    - ml.aiplatform.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - datasets
  sideEffects: None
