---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: datasets.ml.aiplatform.io
spec:
  group: ml.aiplatform.io
  names:
    categories:
    - ml
    kind: Dataset
    listKind: DatasetList
    plural: datasets
    shortNames:
    - dset
    singular: dataset
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.owner
      name: Owner
      type: string
    - jsonPath: .status.observedRows
      name: Rows
      type: integer
    - jsonPath: .spec.golden
      name: Golden
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Dataset is a versioned, immutable input to training and evaluation.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Dataset.
            properties:
              checksum:
                description: |-
                  Checksum is the expected content hash, sha256 only. Same contract as Rows:
                  optional, but load-bearing once set.
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
              golden:
                default: false
                description: |-
                  Golden marks an evaluation dataset. Evaluations may score against golden
                  datasets only, so this flag is a policy input, not a label — a label could
                  be edited by anyone with patch access without passing through this API's
                  validation.
                type: boolean
              owner:
                description: |-
                  Owner is the team accountable for this dataset. It is a spec field for now
                  and becomes webhook-stamped from the authenticated identity in 5.3; until
                  then it is an honour system, which is worth knowing when reading an audit
                  trail from this period.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              rows:
                description: |-
                  Rows is the expected row count. Optional: omit it and the controller
                  records what it finds without complaint; set it and a mismatch fails
                  verification.
                format: int64
                minimum: 1
                type: integer
              uri:
                description: |-
                  URI locates the dataset. The scheme selects the artifact backend, so the
                  set is closed: an unknown scheme must fail at admission rather than at
                  reconcile, where the user is no longer watching.
                maxLength: 2048
                minLength: 1
                pattern: ^(s3|gs|pvc|https)://[^\s]+$
                type: string
            required:
            - owner
            - uri
            type: object
          status:
            description: status defines the observed state of Dataset.
            properties:
              conditions:
                description: |-
                  Conditions is the authoritative state. Each carries observedGeneration, so
                  a reader can tell "verification failed" from "verification has not run
                  against your latest edit yet".
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastResolvedTime:
                description: |-
                  LastResolvedTime is when the artifact was last successfully read. A stale
                  value on a Ready dataset is the signal that the controller has stopped
                  working, which no condition can express on its own.
                format: date-time
                type: string
              observedChecksum:
                description: ObservedChecksum is the hash actually computed over the
                  artifact.
                type: string
              observedRows:
                description: ObservedRows is the row count actually read at the URI.
                format: int64
                type: integer
              phase:
                description: |-
                  Phase summarises Conditions for `kubectl get`. Derived on every reconcile;
                  never read back by the controller as input.
                enum:
                - Pending
                - Resolving
                - Ready
                - Failed
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
