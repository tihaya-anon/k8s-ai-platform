---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
  - apiGroups:
      - ml.aiplatform.io
    resources:
      - datasets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ml.aiplatform.io
    resources:
      - datasets/finalizers
    verbs:
      - update
  - apiGroups:
      - ml.aiplatform.io
    resources:
      - datasets/status
    verbs:
      - get
      - patch
      - update
