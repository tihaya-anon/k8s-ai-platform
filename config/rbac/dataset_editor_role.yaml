# This rule is not used by the project k8s-ai-platform itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the ml.aiplatform.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: k8s-ai-platform
    app.kubernetes.io/managed-by: kustomize
  name: dataset-editor-role
rules:
  - apiGroups:
      - ml.aiplatform.io
    resources:
      - datasets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ml.aiplatform.io
    resources:
      - datasets/status
    verbs:
      - get
